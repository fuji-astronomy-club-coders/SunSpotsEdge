```yaml
name: Python Code Quality

"on":
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip and install TOML parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomlkit

      - name: Update pyproject.toml development dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          from tomlkit import dumps, load

          path = Path("pyproject.toml")

          if not path.exists():
              raise SystemExit("pyproject.toml が見つかりません。")

          with path.open("r", encoding="utf-8") as f:
              doc = load(f)

          project = doc.get("project")
          if project is None:
              raise SystemExit("[project] が pyproject.toml にありません。")

          optional = project.get("optional-dependencies")
          if optional is None:
              optional = {}
              project["optional-dependencies"] = optional

          dev = optional.get("dev")
          if dev is None:
              dev = []
              optional["dev"] = dev

          required = ["ruff", "pyright"]

          def package_name(requirement: str) -> str:
              value = str(requirement).strip()

              for marker in (
                  "[",
                  "==",
                  ">=",
                  "<=",
                  "!=",
                  "~=",
                  ">",
                  "<",
                  ";",
              ):
                  value = value.split(marker, 1)[0]

              return value.strip().lower()

          for package in required:
              if not any(package_name(dep) == package for dep in dev):
                  dev.append(package)

          with path.open("w", encoding="utf-8") as f:
              f.write(dumps(doc))
          PY

      - name: Commit updated pyproject.toml
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml

          if git diff --cached --quiet; then
            echo "pyproject.toml に変更はありません。"
          else
            git commit -m "chore: update CI development dependencies"
            git push
          fi

      - name: Generate CI requirements from pyproject.toml
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tomlkit import load

          pyproject = Path("pyproject.toml")
          requirements = Path(os.environ["RUNNER_TEMP"]) / "requirements-ci.txt"

          with pyproject.open("r", encoding="utf-8") as f:
              doc = load(f)

          project = doc.get("project")
          if project is None:
              raise SystemExit("[project] が pyproject.toml にありません。")

          dependencies = list(project.get("dependencies") or [])

          optional = project.get("optional-dependencies") or {}
          dev = list(optional.get("dev") or [])

          all_requirements = []
          seen = set()

          for requirement in dependencies + dev:
              requirement = str(requirement).strip()

              if requirement and requirement not in seen:
                  all_requirements.append(requirement)
                  seen.add(requirement)

          requirements.write_text(
              "\n".join(all_requirements) + "\n",
              encoding="utf-8",
          )

          print("CI dependencies:")
          for requirement in all_requirements:
              print(f"  - {requirement}")

          print(f"requirements file: {requirements}")
          PY

      - name: Install dependencies without installing the project
        run: |
          python -m pip install -r "${RUNNER_TEMP}/requirements-ci.txt"

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Pyright
        run: |
          pyright
```
